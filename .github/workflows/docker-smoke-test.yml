name: NetSentinel CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  netsentinel-validation:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # Repository Setup
      # ==========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # Install Dependencies
      # ==========================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov uvicorn requests groq

      # ==========================================================
      # Verify Project Structure
      # ==========================================================

      - name: Verify Project Structure
        run: |
          test -f docker-compose.yml
          test -d monitoring
          test -d tests
          test -d src
          test -d src/analytics
          test -d src/ai
          test -d src/api
          test -d src/services
          test -d grafana
          echo "✅ Project structure verified."

      # ==========================================================
      # Verify Test Files
      # ==========================================================

      - name: Verify Test Files
        run: |
          test -f tests/connectivity_test.py
          test -f tests/test_unit.py
          test -f tests/test_integration.py
          test -f tests/test_analysis.py
          test -f tests/test_ai.py
          test -f tests/test_scenario_runner.py
          test -f tests/test_grafana.py
          test -f tests/test_week12_dashboard_and_integration.py
          echo "✅ All test files verified."

      # ==========================================================
      # Verify Monitoring Files
      # ==========================================================

      - name: Verify k6 Scripts
        run: |
          test -f monitoring/k6/smoke-test.js
          test -f monitoring/k6/latency-test.js
          test -f monitoring/k6/load-test.js
          echo "✅ k6 scripts verified."

      - name: Verify Postman Collection
        run: |
          test -f "monitoring/postman/NetSentinel API Tests.postman_collection.json"
          echo "✅ Postman collection verified."

      # ==========================================================
      # Docker Compose Configuration
      # ==========================================================

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config -q
          echo "✅ Docker Compose configuration is valid."

      # ==========================================================
      # STEP 1
      # Start Docker Services BEFORE FastAPI
      #
      # This is important because the FastAPI integration
      # endpoints use PostgreSQL.
      # ==========================================================

      - name: Start Docker Services
        run: |
          echo "=============================================="
          echo "Starting NetSentinel Docker Services"
          echo "=============================================="

          docker compose up -d

          echo "Docker services started."

          docker compose ps

      # ==========================================================
      # STEP 2
      # Wait for PostgreSQL
      # ==========================================================

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."

          POSTGRES_READY=false

          for i in {1..30}; do

            if docker exec netsentinel-db \
              pg_isready -U admin -d netsentinel > /dev/null 2>&1; then

              echo "✅ PostgreSQL is ready."
              POSTGRES_READY=true
              break

            fi

            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2

          done

          if [ "$POSTGRES_READY" != "true" ]; then
            echo "❌ PostgreSQL failed to become ready."
            docker compose logs db
            exit 1
          fi

      # ==========================================================
      # STEP 3
      # Verify PostgreSQL Tables
      # ==========================================================

      - name: Verify PostgreSQL Tables
        run: |
          echo "=============================================="
          echo "PostgreSQL Tables"
          echo "=============================================="

          docker exec netsentinel-db \
            psql -U admin -d netsentinel -c "\dt"

          echo "✅ PostgreSQL database is accessible."

      # ==========================================================
      # STEP 4
      # Validate Docker Volumes
      # ==========================================================

      - name: Validate Docker Volumes
        run: |
          echo "=============================================="
          echo "Validating Docker Volumes"
          echo "=============================================="

          docker volume ls

          docker volume ls --format "{{.Name}}" | grep -q "^netsentinel_grafana_data$"
          echo "✅ grafana_data volume"

          docker volume ls --format "{{.Name}}" | grep -q "^netsentinel_postgres_data$"
          echo "✅ postgres_data volume"

          docker volume ls --format "{{.Name}}" | grep -q "^netsentinel_prometheus_data$"
          echo "✅ prometheus_data volume"

      # ==========================================================
      # STEP 5
      # Validate Prometheus 30-Day Retention
      # ==========================================================

      - name: Validate Prometheus Retention
        run: |
          echo "=============================================="
          echo "Validating Prometheus 30-Day Retention"
          echo "=============================================="

          docker inspect netsentinel-prometheus \
            --format '{{json .Config.Cmd}}'

          docker inspect netsentinel-prometheus \
            --format '{{json .Config.Cmd}}' | grep -q "30d"

          echo "✅ Prometheus 30-day retention configured."

      # ==========================================================
      # STEP 6
      # Wait for Prometheus
      # ==========================================================

      - name: Wait for Prometheus
        run: |
          echo "Waiting for Prometheus..."

          PROMETHEUS_READY=false

          for i in {1..30}; do

            if curl --silent --fail \
              http://localhost:9090/-/ready > /dev/null 2>&1; then

              echo "✅ Prometheus is ready."
              PROMETHEUS_READY=true
              break

            fi

            echo "Waiting for Prometheus... ($i/30)"
            sleep 2

          done

          if [ "$PROMETHEUS_READY" != "true" ]; then
            echo "❌ Prometheus failed to become ready."
            docker compose logs prometheus
            exit 1
          fi

      # ==========================================================
      # STEP 7
      # Wait for Grafana
      # ==========================================================

      - name: Wait for Grafana
        run: |
          echo "Waiting for Grafana..."

          GRAFANA_READY=false

          for i in {1..30}; do

            if curl --silent --fail \
              http://localhost:3000/api/health > /dev/null 2>&1; then

              echo "✅ Grafana is ready."
              GRAFANA_READY=true
              break

            fi

            echo "Waiting for Grafana... ($i/30)"
            sleep 2

          done

          if [ "$GRAFANA_READY" != "true" ]; then
            echo "❌ Grafana failed to become ready."
            docker compose logs grafana
            exit 1
          fi

      # ==========================================================
      # STEP 8
      # Start FastAPI AFTER PostgreSQL is ready
      # ==========================================================

      - name: Start FastAPI Server
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "=============================================="
          echo "Starting FastAPI Server"
          echo "=============================================="

          nohup uvicorn src.api.main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > uvicorn.log 2>&1 &

          SERVER_PID=$!

          echo "$SERVER_PID" > uvicorn.pid

          echo "FastAPI PID: $SERVER_PID"

          echo "Waiting for FastAPI..."

          FASTAPI_READY=false

          for i in {1..30}; do

            if curl --silent --fail \
              http://localhost:8000/health > /dev/null 2>&1; then

              echo "✅ FastAPI is ready."
              FASTAPI_READY=true
              break

            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then

              echo "❌ FastAPI stopped unexpectedly."

              echo "========== FastAPI Logs =========="
              cat uvicorn.log || true
              echo "=================================="

              exit 1

            fi

            echo "Waiting for FastAPI... ($i/30)"
            sleep 2

          done

          if [ "$FASTAPI_READY" != "true" ]; then

            echo "❌ FastAPI failed to become ready."

            echo "========== FastAPI Logs =========="
            cat uvicorn.log || true
            echo "=================================="

            exit 1

          fi

          echo "========== FastAPI Logs =========="
          cat uvicorn.log || true
          echo "=================================="

      # ==========================================================
      # STEP 9
      # FastAPI Health Validation
      # ==========================================================

      - name: Verify Health Endpoint
        run: |
          curl --fail http://localhost:8000/health
          echo
          echo "✅ Health endpoint verified."

      # ==========================================================
      # STEP 10
      # FastAPI Metrics Validation
      # ==========================================================

      - name: Verify Metrics Endpoint
        run: |
          curl --fail http://localhost:8000/metrics
          echo
          echo "✅ Metrics endpoint verified."

      # ==========================================================
      # STEP 11
      # Run Unit Tests
      # ==========================================================

      - name: Run Unit Tests
        run: |
          pytest tests/test_unit.py -v

      # ==========================================================
      # STEP 12
      # Run Connectivity Tests
      # ==========================================================

      - name: Run Connectivity Tests
        run: |
          pytest tests/connectivity_test.py -v

      # ==========================================================
      # STEP 13
      # Run Integration Tests
      #
      # Docker + PostgreSQL are now running BEFORE this step.
      # ==========================================================

      - name: Run Integration Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/test_integration.py -v

      # ==========================================================
      # STEP 14
      # Run Analytics Tests
      # ==========================================================

      - name: Run Analytics Tests
        run: |
          pytest tests/test_analysis.py -v

      # ==========================================================
      # STEP 15
      # Generate Analytics Charts
      # ==========================================================

      - name: Generate Analytics Charts
        run: |
          python test_chart.py

      # ==========================================================
      # STEP 16
      # Verify Analytics Charts
      # ==========================================================

      - name: Verify Generated Charts
        run: |
          test -f monitoring/reports/charts/average_latency.png
          test -f monitoring/reports/charts/p95_latency.png
          test -f monitoring/reports/charts/total_requests.png
          test -f monitoring/reports/charts/packet_loss.png
          test -f monitoring/reports/charts/error_rate.png

          echo "✅ Analytics charts generated successfully."

      # ==========================================================
      # STEP 17
      # Verify Groq API Secret
      # ==========================================================

      - name: Verify Groq API Secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY GitHub Secret is not configured."
            exit 1
          fi

          echo "✅ GROQ_API_KEY is configured."

      # ==========================================================
      # STEP 18
      # Run AI Tests
      # ==========================================================

      - name: Run AI Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/test_ai.py -v

      # ==========================================================
      # STEP 19
      # Run Scenario Tests
      # ==========================================================

      - name: Run Scenario Validation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/test_scenario_runner.py -v

      # ==========================================================
      # STEP 20
      # Generate AI Reports
      # ==========================================================

      - name: Generate AI Reports
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python test_report_generator.py

      # ==========================================================
      # STEP 21
      # Verify AI Reports
      # ==========================================================

      - name: Verify AI Reports
        run: |
          test -f monitoring/reports/executive_summary.txt
          test -f monitoring/reports/detailed_technical_report.txt

          echo "✅ AI reports generated successfully."

      # ==========================================================
      # STEP 22
      # Verify Scenario Reports
      # ==========================================================

      - name: Verify Scenario Reports
        run: |
          test -f monitoring/reports/scenario_reports/healthy_network_report.txt
          test -f monitoring/reports/scenario_reports/high_latency_report.txt
          test -f monitoring/reports/scenario_reports/high_error_rate_report.txt

          echo "✅ Scenario reports verified."

      # ==========================================================
      # STEP 23
      # Run Grafana Tests
      # ==========================================================

      - name: Run Grafana Tests
        run: |
          pytest tests/test_grafana.py -v

      # ==========================================================
      # STEP 24
      # Run Week 12 Dashboard & Integration Tests
      # ==========================================================

      - name: Run Week 12 Dashboard and Integration Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/test_week12_dashboard_and_integration.py -v

      # ==========================================================
      # STEP 25
      # Validate DB Service
      #
      # Your current project uses:
      # src/services/database_service.py
      #
      # Therefore we validate DatabaseService rather than the
      # older src/database/db_manager.py structure.
      # ==========================================================

      - name: Validate Database Service
        run: |
          python -c "
          from src.services.database_service import DatabaseService
          print('✅ DatabaseService imported successfully')
          "

      # ==========================================================
      # STEP 26
      # Validate Grafana Dashboard JSON
      #
      # IMPORTANT:
      # Current dashboard filename uses a hyphen:
      # netsentinel-dashboard.json
      #
      # It is Grafana's newer dashboard structure using:
      # spec.elements
      # rather than the old dashboard.panels structure.
      # ==========================================================

      - name: Validate Grafana Dashboard JSON
        run: |
          python -c "
          import json
          import os

          path = 'grafana/dashboards/netsentinel-dashboard.json'

          assert os.path.exists(path), 'Dashboard JSON not found'

          with open(path, encoding='utf-8') as file:
              data = json.load(file)

          assert data.get('kind') == 'Dashboard', \
              'Invalid Grafana dashboard kind'

          spec = data.get('spec', {})

          assert isinstance(spec, dict), \
              'Dashboard spec is missing'

          elements = spec.get('elements', {})

          assert isinstance(elements, dict), \
              'Dashboard elements are missing'

          panels = [
              element
              for element in elements.values()
              if isinstance(element, dict)
              and element.get('kind') == 'Panel'
          ]

          print(f'✅ Grafana dashboard contains {len(panels)} panels')

          assert len(panels) >= 4, \
              'Dashboard must contain at least 4 panels'

          titles = [
              panel.get('spec', {}).get('title', '')
              for panel in panels
          ]

          print('Dashboard panels:')

          for title in titles:
              print(f'  - {title}')

          connectivity_found = any(
              'Connectivity' in title
              for title in titles
          )

          assert connectivity_found, \
              'Connectivity panel not found'

          print('✅ Connectivity panel verified')
          "

      # ==========================================================
      # STEP 27
      # Validate Prometheus Metrics
      # ==========================================================

      - name: Validate Prometheus Metrics
        run: |
          echo "=============================================="
          echo "Validating NetSentinel Prometheus Metrics"
          echo "=============================================="

          for metric in \
            netsentinel_k6_average_latency_ms \
            netsentinel_k6_p95_latency_ms \
            netsentinel_k6_total_requests \
            netsentinel_k6_failed_requests \
            netsentinel_k6_packet_loss_percent \
            netsentinel_k6_error_rate_percent \
            netsentinel_postman_total_requests \
            netsentinel_postman_failed_requests \
            netsentinel_postman_total_assertions \
            netsentinel_postman_failed_assertions \
            netsentinel_postman_average_response_time_ms
          do

            echo "Checking $metric ..."

            curl --silent --fail \
              "http://localhost:9090/api/v1/query?query=$metric" \
              > /tmp/prometheus_response.json

            python -c "
          import json

          with open('/tmp/prometheus_response.json') as file:
              data = json.load(file)

          assert data.get('status') == 'success'

          print('✅ Prometheus query successful')
          "

          done

      # ==========================================================
      # STEP 28
      # Run Complete Test Suite
      # ==========================================================

      - name: Run Complete Test Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/ -v

      # ==========================================================
      # STEP 29
      # Generate Coverage Report
      # ==========================================================

      - name: Generate Coverage Report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      # ==========================================================
      # STEP 30
      # Upload Coverage Report
      # ==========================================================

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netsentinel-coverage-report
          path: |
            coverage.xml
            htmlcov/

      # ==========================================================
      # STEP 31
      # Upload Week 12 Evidence
      # ==========================================================

      - name: Upload Week 12 Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netsentinel-week12-evidence
          path: |
            evidence/week12/
            grafana/dashboards/netsentinel-dashboard.json
            monitoring/reports/charts/
            monitoring/reports/*.txt
            monitoring/reports/scenario_reports/
            monitoring/reports/networkwatcher/

      # ==========================================================
      # STEP 32
      # Show Logs When Something Fails
      # ==========================================================

      - name: Show FastAPI Logs on Failure
        if: failure()
        run: |
          echo "=============================================="
          echo "FastAPI Logs"
          echo "=============================================="

          if [ -f uvicorn.log ]; then
            cat uvicorn.log
          else
            echo "No uvicorn.log found."
          fi

          echo "=============================================="
          echo "Docker Containers"
          echo "=============================================="

          docker ps -a

          echo "=============================================="
          echo "PostgreSQL Tables"
          echo "=============================================="

          docker exec netsentinel-db \
            psql -U admin -d netsentinel -c "\dt" || true

          echo "=============================================="
          echo "Docker Compose Logs"
          echo "=============================================="

          docker compose logs --no-color || true

      # ==========================================================
      # STEP 33
      # Cleanup
      # ==========================================================

      - name: Stop NetSentinel Services
        if: always()
        run: |
          docker compose down

      # ==========================================================
      # Final Validation
      # ==========================================================

      - name: NetSentinel Validation Complete
        if: success()
        run: |
          echo "=================================================="
          echo "       NetSentinel CI Pipeline Completed"
          echo "=================================================="
          echo "Week 5 Validation        : PASSED"
          echo "Week 6 Validation        : PASSED"
          echo "Week 7 Validation        : PASSED"
          echo "Week 8 Validation        : PASSED"
          echo "Week 11 Validation       : PASSED"
          echo "Week 12 Validation       : PASSED"
          echo "PostgreSQL               : VERIFIED"
          echo "Prometheus               : VERIFIED"
          echo "30-Day Retention         : VERIFIED"
          echo "Grafana                  : VERIFIED"
          echo "Dashboard                : VERIFIED"
          echo "Integration Tests        : PASSED"
          echo "AI / Groq                : VERIFIED"
          echo "Coverage Report         : GENERATED"
          echo "=================================================="
          echo "All NetSentinel validations completed successfully!"
          echo "=================================================="