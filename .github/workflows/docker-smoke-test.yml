name: NetSentinel CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  netsentinel-validation:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # Repository Setup
      # ==========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # Install Dependencies
      # ==========================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov uvicorn requests groq

      # ==========================================================
      # Week 5 Validation
      # ==========================================================

      - name: Verify Project Structure
        run: |
          test -f docker-compose.yml
          test -d monitoring
          test -d tests
          test -d src/analytics
          test -d src/ai
          test -d grafana
          echo "Project structure verified."

      - name: Verify Test Files
        run: |
          test -f tests/connectivity_test.py
          test -f tests/test_unit.py
          test -f tests/test_integration.py
          test -f tests/test_analysis.py
          test -f tests/test_ai.py
          test -f tests/test_scenario_runner.py
          test -f tests/test_grafana.py
          echo "All test files verified."

      - name: Verify k6 Scripts
        run: |
          test -f monitoring/k6/smoke-test.js
          test -f monitoring/k6/latency-test.js
          test -f monitoring/k6/load-test.js
          echo "k6 scripts verified."

      - name: Verify Postman Collection
        run: |
          test -f "monitoring/postman/NetSentinel API Tests.postman_collection.json"
          echo "Postman collection verified."

      # ==========================================================
      # Week 6 Validation
      # ==========================================================

      - name: Start FastAPI Server
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          nohup uvicorn src.api.main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > uvicorn.log 2>&1 &

          echo $! > uvicorn.pid

          echo "Waiting for FastAPI to start..."

          for i in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "FastAPI started successfully."
              break
            fi
            sleep 2
          done

          if ! curl -sf http://localhost:8000/health > /dev/null; then
            echo "FastAPI failed to start."
            cat uvicorn.log
            exit 1
          fi

          echo "FastAPI logs:"
          cat uvicorn.log

      - name: Verify Health Endpoint
        run: |
          curl --fail http://localhost:8000/health
          echo
          echo "Health endpoint verified."

      - name: Verify Metrics Endpoint
        run: |
          curl --fail http://localhost:8000/metrics
          echo
          echo "Metrics endpoint verified."

      - name: Run Unit Tests
        run: |
          pytest tests/test_unit.py -v

      - name: Run Connectivity Tests
        run: |
          pytest tests/connectivity_test.py -v

      - name: Run Integration Tests
        run: |
          pytest tests/test_integration.py -v

      # ==========================================================
      # Week 7 Validation
      # ==========================================================

      - name: Run Analytics Tests
        run: |
          pytest tests/test_analysis.py -v

      - name: Generate Analytics Charts
        run: |
          python test_chart.py

      - name: Verify Generated Charts
        run: |
          test -f monitoring/reports/charts/average_latency.png
          test -f monitoring/reports/charts/p95_latency.png
          test -f monitoring/reports/charts/total_requests.png
          test -f monitoring/reports/charts/packet_loss.png
          test -f monitoring/reports/charts/error_rate.png
          echo "Analytics charts generated successfully."

      # ==========================================================
      # Week 8 Validation - AI / Groq
      # ==========================================================

      - name: Verify Groq API Secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: GROQ_API_KEY GitHub Secret is not configured."
            exit 1
          fi

          echo "GROQ_API_KEY is configured."

      - name: Run AI Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/test_ai.py -v

      - name: Run Scenario Validation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/test_scenario_runner.py -v

      - name: Generate AI Reports
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python test_report_generator.py

      - name: Verify AI Reports
        run: |
          test -f monitoring/reports/executive_summary.txt
          test -f monitoring/reports/detailed_technical_report.txt
          echo "AI reports generated successfully."

      - name: Verify Scenario Reports
        run: |
          test -f monitoring/reports/scenario_reports/healthy_network_report.txt
          test -f monitoring/reports/scenario_reports/high_latency_report.txt
          test -f monitoring/reports/scenario_reports/high_error_rate_report.txt
          echo "Scenario reports generated successfully."

      # ==========================================================
      # Week 11 Validation - Grafana & Prometheus
      # ==========================================================

      - name: Start Prometheus and Grafana
        run: |
          docker compose up -d prometheus grafana

          echo "Waiting for Prometheus and Grafana..."

          for i in {1..30}; do

            PROMETHEUS_OK=false
            GRAFANA_OK=false

            if curl -sf http://localhost:9090/-/ready > /dev/null; then
              PROMETHEUS_OK=true
            fi

            if curl -sf http://localhost:3000/api/health > /dev/null; then
              GRAFANA_OK=true
            fi

            if [ "$PROMETHEUS_OK" = true ] && [ "$GRAFANA_OK" = true ]; then
              echo "Prometheus and Grafana are ready."
              break
            fi

            sleep 2
          done

          if ! curl -sf http://localhost:9090/-/ready > /dev/null; then
            echo "Prometheus failed to start."
            docker compose logs prometheus
            exit 1
          fi

          if ! curl -sf http://localhost:3000/api/health > /dev/null; then
            echo "Grafana failed to start."
            docker compose logs grafana
            exit 1
          fi

      # ----------------------------------------------------------
      # Verify Prometheus
      # ----------------------------------------------------------

      - name: Verify Prometheus Health
        run: |
          curl --fail http://localhost:9090/-/ready
          echo
          echo "Prometheus is healthy."

      # ----------------------------------------------------------
      # Verify Grafana
      # ----------------------------------------------------------

      - name: Verify Grafana Health
        run: |
          curl --fail http://localhost:3000/api/health
          echo
          echo "Grafana is healthy."

      # ----------------------------------------------------------
      # Populate NetSentinel Prometheus Metrics
      # ----------------------------------------------------------

      - name: Populate Prometheus Metrics
        run: |
          echo "Calling NetSentinel performance endpoint..."
          curl --fail http://localhost:8000/performance/summary

          echo
          echo "Waiting for Prometheus to scrape metrics..."
          sleep 10

      # ----------------------------------------------------------
      # Verify NetSentinel Metrics
      # ----------------------------------------------------------

      - name: Verify NetSentinel Latency Metric
        run: |
          RESPONSE=$(curl -sf \
            "http://localhost:9090/api/v1/query?query=netsentinel_k6_average_latency_ms")

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"status":"success"'
          echo "$RESPONSE" | grep -q '"result":\['

          if echo "$RESPONSE" | grep -q '"result":\[\]'; then
            echo "ERROR: NetSentinel latency metric was not found."
            exit 1
          fi

          echo "NetSentinel latency metric verified."

      - name: Verify NetSentinel Failed Requests Metric
        run: |
          RESPONSE=$(curl -sf \
            "http://localhost:9090/api/v1/query?query=netsentinel_k6_failed_requests")

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"status":"success"'
          echo "$RESPONSE" | grep -q '"result":\['

          if echo "$RESPONSE" | grep -q '"result":\[\]'; then
            echo "ERROR: NetSentinel failed requests metric was not found."
            exit 1
          fi

          echo "NetSentinel failed requests metric verified."

      # ----------------------------------------------------------
      # Verify Grafana Dashboard
      # ----------------------------------------------------------

      - name: Verify Grafana Dashboard File
        run: |
          test -f grafana/dashboards/netsentinel-dashboard.json
          echo "Grafana dashboard file exists."

      - name: Validate Grafana Dashboard JSON
        run: |
          python - <<'PY'
          import json

          dashboard_file = "grafana/dashboards/netsentinel-dashboard.json"

          with open(dashboard_file, "r", encoding="utf-8") as file:
              dashboard = json.load(file)

          assert isinstance(dashboard, dict)

          print("Grafana dashboard JSON is valid.")
          PY

      # ----------------------------------------------------------
      # Run Grafana Tests
      # ----------------------------------------------------------

      - name: Run Grafana Tests
        run: |
          pytest tests/test_grafana.py -v

      # ==========================================================
      # Week 11 - Verify Monitoring Reports
      # ==========================================================

      - name: Verify Monitoring Reports
        run: |
          test -f monitoring/reports/latency-test-results.json
          test -f monitoring/reports/load-test-results.json
          test -f monitoring/reports/smoke-test-results.json
          test -f monitoring/reports/networkwatcher/networkwatcher-report.json
          test -f monitoring/reports/postman/postman-report.json
          echo "Monitoring reports verified."

      - name: Verify Monitoring Charts
        run: |
          test -f monitoring/reports/charts/average_latency.png
          test -f monitoring/reports/charts/p95_latency.png
          test -f monitoring/reports/charts/total_requests.png
          test -f monitoring/reports/charts/packet_loss.png
          test -f monitoring/reports/charts/error_rate.png
          echo "Monitoring charts verified."

      # ----------------------------------------------------------
      # Week 11 Evidence
      # ----------------------------------------------------------

      - name: Verify Week 11 Evidence
        run: |
          test -f evidence/week11/grafana-dashboard.png
          test -f evidence/week11/network-health.png
          test -f evidence/week11/network-quality.png
          test -f evidence/week11/traffic-errors.png
          echo "Week 11 evidence verified."

      # ==========================================================
      # Full Test Suite
      # ==========================================================

      - name: Run Full Test Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest -v

      # ==========================================================
      # Coverage Report
      # ==========================================================

      - name: Generate Coverage Report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      # ==========================================================
      # Upload Week 11 Evidence
      # ==========================================================

      - name: Upload Week 11 Evidence
        uses: actions/upload-artifact@v4
        with:
          name: netsentinel-week11-evidence
          path: |
            evidence/week11/
            grafana/dashboards/netsentinel-dashboard.json
            monitoring/reports/charts/
            monitoring/reports/*.txt
            monitoring/reports/scenario_reports/

      # ==========================================================
      # Cleanup
      # ==========================================================

      - name: Stop Monitoring Containers
        if: always()
        run: |
          docker compose down

      - name: Show Logs on Failure
        if: failure()
        run: |
          echo "======================================"
          echo "FastAPI Logs"
          echo "======================================"

          if [ -f uvicorn.log ]; then
            cat uvicorn.log
          else
            echo "No uvicorn.log found."
          fi

          echo "======================================"
          echo "Docker Containers"
          echo "======================================"

          docker ps -a

          echo "======================================"
          echo "Docker Compose Logs"
          echo "======================================"

          docker compose logs --no-color || true

      # ==========================================================
      # Validation Complete
      # ==========================================================

      - name: NetSentinel Validation Complete
        run: |
          echo "=============================================="
          echo "      NetSentinel CI Pipeline Completed"
          echo "=============================================="
          echo "Week 5 Validation  : PASSED"
          echo "Week 6 Validation  : PASSED"
          echo "Week 7 Validation  : PASSED"
          echo "Week 8 Validation  : PASSED"
          echo "Week 11 Validation : PASSED"
          echo "Grafana            : VERIFIED"
          echo "Prometheus         : VERIFIED"
          echo "AI / Groq          : VERIFIED"
          echo "Full Test Suite    : PASSED"
          echo "Coverage Report    : GENERATED"
          echo "Week 11 Evidence   : UPLOADED"
          echo "=============================================="
          echo "All validations completed successfully!"
          echo "=============================================="