name: NetSentinel CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  netsentinel-validation:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # STEP 1 - Repository Setup
      # ==========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # STEP 2 - Install Dependencies
      # ==========================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-json-report uvicorn requests groq

      # ==========================================================
      # STEP 3 - Verify Project Structure
      # ==========================================================

      - name: Verify Project Structure
        run: |
          test -f docker-compose.yml
          test -d monitoring
          test -d tests
          test -d src
          test -d src/analytics
          test -d src/ai
          test -d src/api
          test -d src/services
          test -d src/network
          test -d grafana

          echo "✅ Project structure verified."

      # ==========================================================
      # STEP 4 - Verify Test Files
      # ==========================================================

      - name: Verify Test Files
        run: |
          test -f tests/connectivity_test.py
          test -f tests/test_unit.py
          test -f tests/test_integration.py
          test -f tests/test_analysis.py
          test -f tests/test_ai.py
          test -f tests/test_scenario_runner.py
          test -f tests/test_grafana.py
          test -f tests/test_week12_dashboard_and_integration.py
          test -f tests/test_week13.py
          test -f tests/test_week14.py
          test -f tests/test_week15.py
          test -f test_groq.py

          echo "✅ All test files verified."

      # ==========================================================
      # STEP 5 - Verify Monitoring Files
      # ==========================================================

      - name: Verify k6 Scripts
        run: |
          test -f monitoring/k6/smoke-test.js
          test -f monitoring/k6/latency-test.js
          test -f monitoring/k6/load-test.js

          echo "✅ k6 scripts verified."

      - name: Verify Postman Collection
        run: |
          test -f "monitoring/postman/NetSentinel API Tests.postman_collection.json"

          echo "✅ Postman collection verified."

      # ==========================================================
      # STEP 6 - Verify Week 13 AI Files
      # ==========================================================

      - name: Verify Week 13 AI Files
        run: |
          test -f src/ai/benchmark.py
          test -f src/ai/llm_service.py
          test -f src/ai/prompt_builder.py
          test -f test_groq.py

          echo "✅ Week 13 AI files verified."

      # ==========================================================
      # STEP 7 - Verify Azure Network Watcher Files
      # ==========================================================

      - name: Verify Azure Network Watcher
        run: |
          test -f src/network/azure_network_watcher.py

          echo "✅ Azure Network Watcher module verified."

      # ==========================================================
      # STEP 8 - Verify Week 14 AI Files
      # ==========================================================

      - name: Verify Week 14 AI Files
        run: |
          test -f src/ai/prompt_templates.py
          test -f src/ai/scenario_runner_v2.py
          test -f src/ai/quality_validator.py

          echo "✅ Week 14 AI files verified."

      # ==========================================================
      # STEP 9 - Docker Compose Configuration
      # ==========================================================

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config -q

          echo "✅ Docker Compose configuration is valid."

      # ==========================================================
      # STEP 10 - Start Docker Services
      # ==========================================================

      - name: Start Docker Services
        run: |
          echo "=============================================="
          echo "Starting NetSentinel Docker Services"
          echo "=============================================="

          docker compose up -d

          echo "Docker services started."

          docker compose ps

      # ==========================================================
      # STEP 11 - Wait for PostgreSQL
      # ==========================================================

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."

          POSTGRES_READY=false

          for i in {1..30}; do

            if docker exec netsentinel-db \
              pg_isready -U admin -d netsentinel > /dev/null 2>&1; then

              echo "✅ PostgreSQL is ready."
              POSTGRES_READY=true
              break

            fi

            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2

          done

          if [ "$POSTGRES_READY" != "true" ]; then
            echo "❌ PostgreSQL failed to become ready."
            docker compose logs db
            exit 1
          fi

      # ==========================================================
      # STEP 12 - Verify PostgreSQL Tables
      # ==========================================================

      - name: Verify PostgreSQL Tables
        run: |
          echo "=============================================="
          echo "PostgreSQL Tables"
          echo "=============================================="

          docker exec netsentinel-db \
            psql -U admin -d netsentinel -c "\dt"

          echo "✅ PostgreSQL database is accessible."

      # ==========================================================
      # STEP 13 - Validate Docker Volumes
      # ==========================================================

      - name: Validate Docker Volumes
        run: |
          echo "=============================================="
          echo "Validating Docker Volumes"
          echo "=============================================="

          docker volume ls

          docker volume ls --format "{{.Name}}" | \
            grep -q "^netsentinel_grafana_data$"

          echo "✅ grafana_data volume"

          docker volume ls --format "{{.Name}}" | \
            grep -q "^netsentinel_postgres_data$"

          echo "✅ postgres_data volume"

          docker volume ls --format "{{.Name}}" | \
            grep -q "^netsentinel_prometheus_data$"

          echo "✅ prometheus_data volume"

      # ==========================================================
      # STEP 14 - Validate Prometheus 30-Day Retention
      # ==========================================================

      - name: Validate Prometheus Retention
        run: |
          echo "=============================================="
          echo "Validating Prometheus 30-Day Retention"
          echo "=============================================="

          docker inspect netsentinel-prometheus \
            --format '{{json .Config.Cmd}}'

          docker inspect netsentinel-prometheus \
            --format '{{json .Config.Cmd}}' | grep -q "30d"

          echo "✅ Prometheus 30-day retention configured."

      # ==========================================================
      # STEP 15 - Wait for Prometheus
      # ==========================================================

      - name: Wait for Prometheus
        run: |
          echo "Waiting for Prometheus..."

          PROMETHEUS_READY=false

          for i in {1..30}; do

            if curl --silent --fail \
              http://localhost:9090/-/ready > /dev/null 2>&1; then

              echo "✅ Prometheus is ready."
              PROMETHEUS_READY=true
              break

            fi

            echo "Waiting for Prometheus... ($i/30)"
            sleep 2

          done

          if [ "$PROMETHEUS_READY" != "true" ]; then
            echo "❌ Prometheus failed to become ready."
            docker compose logs prometheus
            exit 1
          fi

      # ==========================================================
      # STEP 16 - Wait for Grafana
      # ==========================================================

      - name: Wait for Grafana
        run: |
          echo "Waiting for Grafana..."

          GRAFANA_READY=false

          for i in {1..30}; do

            if curl --silent --fail \
              http://localhost:3000/api/health > /dev/null 2>&1; then

              echo "✅ Grafana is ready."
              GRAFANA_READY=true
              break

            fi

            echo "Waiting for Grafana... ($i/30)"
            sleep 2

          done

          if [ "$GRAFANA_READY" != "true" ]; then
            echo "❌ Grafana failed to become ready."
            docker compose logs grafana
            exit 1
          fi

      # ==========================================================
      # STEP 17 - Start FastAPI Server
      # ==========================================================

      - name: Start FastAPI Server
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "=============================================="
          echo "Starting FastAPI Server"
          echo "=============================================="

          nohup uvicorn src.api.main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > uvicorn.log 2>&1 &

          SERVER_PID=$!

          echo "$SERVER_PID" > uvicorn.pid

          echo "FastAPI PID: $SERVER_PID"

          echo "Waiting for FastAPI..."

          FASTAPI_READY=false

          for i in {1..30}; do

            if curl --silent --fail \
              http://localhost:8000/health > /dev/null 2>&1; then

              echo "✅ FastAPI is ready."
              FASTAPI_READY=true
              break

            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then

              echo "❌ FastAPI stopped unexpectedly."

              echo "========== FastAPI Logs =========="
              cat uvicorn.log || true
              echo "=================================="

              exit 1

            fi

            echo "Waiting for FastAPI... ($i/30)"
            sleep 2

          done

          if [ "$FASTAPI_READY" != "true" ]; then

            echo "❌ FastAPI failed to become ready."

            echo "========== FastAPI Logs =========="
            cat uvicorn.log || true
            echo "=================================="

            exit 1

          fi

          echo "========== FastAPI Logs =========="
          cat uvicorn.log || true
          echo "=================================="

      # ==========================================================
      # STEP 18 - FastAPI Health Validation
      # ==========================================================

      - name: Verify Health Endpoint
        run: |
          curl --fail http://localhost:8000/health

          echo
          echo "✅ Health endpoint verified."

      # ==========================================================
      # STEP 19 - FastAPI Metrics Validation
      # ==========================================================

      - name: Verify Metrics Endpoint
        run: |
          curl --fail http://localhost:8000/metrics

          echo
          echo "✅ Metrics endpoint verified."

      # ==========================================================
      # STEP 20 - Run Unit Tests
      # ==========================================================

      - name: Run Unit Tests
        run: |
          pytest tests/test_unit.py -v

      # ==========================================================
      # STEP 21 - Run Connectivity Tests
      # ==========================================================

      - name: Run Connectivity Tests
        run: |
          pytest tests/connectivity_test.py -v

      # ==========================================================
      # STEP 22 - Run Integration Tests
      # ==========================================================

      - name: Run Integration Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/test_integration.py -v

      # ==========================================================
      # STEP 23 - Run Analytics Tests
      # ==========================================================

      - name: Run Analytics Tests
        run: |
          pytest tests/test_analysis.py -v

      # ==========================================================
      # STEP 24 - Generate Analytics Charts
      # ==========================================================

      - name: Generate Analytics Charts
        run: |
          python test_chart.py

      # ==========================================================
      # STEP 25 - Verify Generated Charts
      # ==========================================================

      - name: Verify Generated Charts
        run: |
          test -f monitoring/reports/charts/average_latency.png
          test -f monitoring/reports/charts/p95_latency.png
          test -f monitoring/reports/charts/total_requests.png
          test -f monitoring/reports/charts/packet_loss.png
          test -f monitoring/reports/charts/error_rate.png

          echo "✅ Analytics charts generated successfully."

      # ==========================================================
      # STEP 26 - Verify Groq API Secret
      # ==========================================================

      - name: Verify Groq API Secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY GitHub Secret is not configured."
            exit 1
          fi

          echo "✅ GROQ_API_KEY is configured."

      # ==========================================================
      # STEP 27 - Run AI Tests
      # ==========================================================

      - name: Run AI Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/test_ai.py -v

      # ==========================================================
      # STEP 28 - Run Scenario Tests
      # ==========================================================

      - name: Run Scenario Validation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/test_scenario_runner.py -v

      # ==========================================================
      # STEP 29 - Generate AI Reports
      # ==========================================================

      - name: Generate AI Reports
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python test_report_generator.py

      # ==========================================================
      # STEP 30 - Verify AI Reports
      # ==========================================================

      - name: Verify AI Reports
        run: |
          test -f monitoring/reports/executive_summary.txt
          test -f monitoring/reports/detailed_technical_report.txt

          echo "✅ AI reports generated successfully."

      # ==========================================================
      # STEP 31 - Verify Scenario Reports
      # ==========================================================

      - name: Verify Scenario Reports
        run: |
          test -f monitoring/reports/scenario_reports/healthy_network_report.txt
          test -f monitoring/reports/scenario_reports/high_latency_report.txt
          test -f monitoring/reports/scenario_reports/high_error_rate_report.txt

          echo "✅ Scenario reports verified."

      # ==========================================================
      # STEP 32 - Run Grafana Tests
      # ==========================================================

      - name: Run Grafana Tests
        run: |
          pytest tests/test_grafana.py -v

      # ==========================================================
      # STEP 33 - Run Week 12 Dashboard & Integration Tests
      # ==========================================================

      - name: Run Week 12 Dashboard and Integration Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/test_week12_dashboard_and_integration.py -v

      # ==========================================================
      # STEP 34 - Validate Database Service
      # ==========================================================

      - name: Validate Database Service
        run: |
          python -c "
          from src.services.database_service import DatabaseService
          print('✅ DatabaseService imported successfully')
          "

      # ==========================================================
      # STEP 35 - Validate Grafana Dashboard JSON
      # ==========================================================

      - name: Validate Grafana Dashboard JSON
        run: |
          python -c "
          import json
          import os

          path = 'grafana/dashboards/netsentinel-dashboard.json'

          assert os.path.exists(path), 'Dashboard JSON not found'

          with open(path, encoding='utf-8') as file:
              data = json.load(file)

          assert data.get('kind') == 'Dashboard', \
              'Invalid Grafana dashboard kind'

          spec = data.get('spec', {})

          assert isinstance(spec, dict), \
              'Dashboard spec is missing'

          elements = spec.get('elements', {})

          assert isinstance(elements, dict), \
              'Dashboard elements are missing'

          panels = [
              element
              for element in elements.values()
              if isinstance(element, dict)
              and element.get('kind') == 'Panel'
          ]

          print(f'✅ Grafana dashboard contains {len(panels)} panels')

          assert len(panels) >= 4, \
              'Dashboard must contain at least 4 panels'

          titles = [
              panel.get('spec', {}).get('title', '')
              for panel in panels
          ]

          print('Dashboard panels:')

          for title in titles:
              print(f'  - {title}')

          connectivity_found = any(
